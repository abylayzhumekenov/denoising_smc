data:
  name: 'Burgers'
  datapath: 'data/testing/burgers.mat'
  offset: 0
  sensors: 5
  sensor_seed: 0

test:
  pre-trained: 'pretrained-models/pretrained-burgers.pkl'

generate:
  seed: 0
  device: 'auto'
  sigma_min: 0.002
  sigma_max: 80
  rho: 7

smc:
  n_particles: 4
  num_steps: 2000
  rho_temp: 1.0
  rho_temp_init: 1.0
  lambda_girs: 1.0
  resample_threshold: 0.5
  likelihood:
    # Guidance weights on the raw-units losses (unsquared L2 norms, index-unit residual).
    # obs_weight kept at the baseline's early-phase zeta_obs=320 (preserves the observation
    # weight/guidance strength); pde_weight set so omega/beta ~= zeta_pde/(zeta_obs/10) ~= 3.1,
    # i.e. the baseline's late-phase obs:pde balance, lifting the PDE drift share from ~0.6%
    # (at 100) to ~5%. The guidance is delta-scaled, so these are independent of K. Tuned per PDE.
    obs_weight: 320.0
    pde_weight: 1000.0
