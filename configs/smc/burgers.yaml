data:
  name: 'Burgers'
  datapath: 'data/testing/burgers.mat'
  offset: 0
  sensors: 5
  sensor_seed: 0

test:
  pre-trained: 'pretrained-models/pretrained-burgers.pkl'

generate:
  seed: 0
  device: 'auto'
  sigma_min: 0.002
  sigma_max: 80
  rho: 7

smc:
  n_particles: 4
  num_steps: 2000
  rho_temp: 1.0
  rho_temp_init: 1.0
  lambda_girs: 1.0
  resample_threshold: 0.5
  likelihood:
    # Guidance weights on the raw-units losses (unsquared L2 norms, index-unit residual).
    # Burgers is not in Millard's weight table; 320/100 are the released ODE baseline's
    # zeta_obs/zeta_pde (the convention Millard reused). Tuned per PDE, not transferable.
    obs_weight: 320.0
    pde_weight: 100.0
