data:
  name: 'Burgers'
  datapath: 'data/testing/burgers.mat'
  offset: 0
  sensors: 5
  sensor_seed: 0

test:
  pre-trained: 'pretrained-models/pretrained-burgers.pkl'

generate:
  seed: 0
  device: 'auto'
  sigma_min: 0.002
  sigma_max: 80
  rho: 7

smc:
  n_particles: 4
  num_steps: 2000
  rho_temp: 1.0
  rho_temp_init: 1.0
  lambda_girs: 1.0
  resample_threshold: 0.5
  likelihood:
    # Guidance weights on Millard's squared raw-units losses (l_obs = mean mask*(u-u_gt)^2,
    # l_res = mean f(u)^2). They absorb all units/discretization/physics scaling and are tuned
    # per problem (no invariance/transfer claim); start at 1 and tune.
    obs_weight: 1.0
    pde_weight: 1.0
