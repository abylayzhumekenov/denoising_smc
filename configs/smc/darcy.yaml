data:
  name: 'Darcy'
  datapath: 'data/testing/darcy.mat'
  offset: 1001
  sensors: 500
  sensor_seed_a: 1
  sensor_seed_u: 0

test:
  pre-trained: 'pretrained-models/pretrained-darcy.pkl'

generate:
  seed: 0
  device: 'auto'
  sigma_min: 0.002
  sigma_max: 80
  rho: 7

smc:
  n_particles: 4
  num_steps: 2000
  proposal: 'em'
  rho_temp: 1.0
  rho_temp_init: 1.0
  lambda_girs: 1.0
  resample_threshold: 0.5
  likelihood:
    # Millard's published Darcy weights (Appendix tab:weights): gamma=5 (obs a), beta=5000 (obs u),
    # omega=100 (PDE residual).  Taken at face value with the papers' faithful residual
    # f = div(a grad u) + s(c) implemented by darcy_residual.
    obs_weight_a: 5.0
    obs_weight_u: 5000.0
    pde_weight: 100.0
